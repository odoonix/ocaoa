<svg xmlns="http://www.w3.org/2000/svg"
     width="752" height="352" viewBox="0 0 752 352">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F4F6"/>
      <stop offset="100%" stop-color="#EEE8ED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="752" height="352" rx="22" fill="url(#bg)"/>

  <!-- Simple geometric decoration -->
  <circle cx="620" cy="92" r="82" fill="#00A09D" opacity="0.88"/>
  <circle cx="687" cy="220" r="54" fill="#F9A825" opacity="0.92"/>
  <circle cx="555" cy="278" r="42" fill="#875A7B" opacity="0.92"/>
  <rect x="584" y="116" width="104" height="104" rx="18"
        fill="#714B67" transform="rotate(12 636 168)"/>
  <circle cx="636" cy="168" r="22" fill="#FFFFFF" opacity="0.9"/>

  <!-- Small decorative shapes -->
  <circle cx="510" cy="66" r="9" fill="#F9A825"/>
  <rect x="694" y="54" width="18" height="18" rx="5"
        fill="#875A7B" transform="rotate(25 703 63)"/>
  <circle cx="500" cy="220" r="7" fill="#00A09D"/>

  <!-- Module title: replace this text -->
  <text x="64" y="164"
        font-family="Arial, sans-serif"
        font-size="38"
        font-weight="700"
        fill="#3F3540"
        letter-spacing="-0.8">
    MODULE TITLE
  </text>

  <!-- Odoo version badge -->
  <rect x="64" y="194" width="112" height="34" rx="17"
        fill="#714B67"/>
  <text x="120" y="216"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="700"
        text-anchor="middle"
        fill="#FFFFFF">
    Odoo 19.0
  </text>

  <!-- Subtle baseline accent -->
  <rect x="64" y="250" width="54" height="5" rx="2.5"
        fill="#00A09D"/>

</svg>