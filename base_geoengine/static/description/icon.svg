<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64" height="64">

    <defs>
        <linearGradient id="pinGlass"
                        x1="0" y1="0"
