    <!-- Location Pin - Front Layer -->
    <path d="M32 5
             C23 5 17 12 17 22
             C17 34 32 51 32 51
             C32 51 47 34 47 22
             C47 12 41 5 32 5 Z"
          fill="url(#pinGlass)"/>

    <!-- Glass Highlight -->
    <path d="M23 15
             C25 11 29 10 33 10"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.55"/>

    <!-- Pin Center -->
    <circle cx="32" cy="22"
            r="6"
            fill="#FFFFFF"
            fill-opacity="0.9"/>

</svg>