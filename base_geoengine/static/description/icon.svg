            <stop offset="0%"
                    stop-color="#BDA6D2"
                    stop-opacity="0.95"/>
            <stop offset="100%"
                    stop-color="#714B67"
                    stop-opacity="0.9"/>
        </linearGradient>
    </defs>

    <!-- Map - Bottom Layer -->
    <path d="M5 34 L19 29 L19 53 L5 58 Z"
          fill="#00A09D"/>

    <path d="M19 29 L39 35 L39 59 L19 53 Z"
